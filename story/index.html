<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="다이샵아울렛이 제품을 고르고 고객을 만나는 이야기를 기록합니다.">
  <meta name="theme-color" content="#F6F1E7">
  <title>이야기 | DIYOUTLET</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body class="story-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>

  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="../index.html" aria-label="DIYOUTLET 홈">
        <span>DIY</span>OUTLET<i aria-hidden="true"></i>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
        <span class="sr-only">메뉴 열기</span>
        <span></span><span></span>
      </button>
      <nav class="main-menu" id="main-menu" aria-label="주 메뉴">
        <a href="../products.html">제품</a>
        <a href="../about.html">내 소개</a>
        <a href="index.html" aria-current="page">이야기</a>
        <a href="../contact.html">연락하기</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="story-archive-hero">
      <div class="story-wrap reveal">
        <p class="section-label">DIYOUTLET JOURNAL</p>
        <h1>생활의 쓰임을<br>천천히 기록합니다.</h1>
        <p>제품을 고르는 기준과 고객을 만나며 배운 것들을 솔직하게 전합니다.</p>
      </div>
    </section>

    <section class="story-archive section" aria-labelledby="story-list-title">
      <div class="story-wrap">
        <div class="story-list-heading reveal">
          <h2 id="story-list-title">모든 이야기</h2>
          <a href="admin.html">글 관리</a>
        </div>
        <ul class="story-list" id="story-list">
          <li class="story-status">이야기를 불러오는 중입니다.</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-top">
      <a class="footer-logo" href="../index.html"><span>DIY</span>OUTLET</a>
      <p>생활에 필요한 다양한 상품을 한곳에서.</p>
    </div>
    <div class="container footer-bottom">
      <p>© <span id="year"></span> DIYOUTLET. ALL RIGHTS RESERVED.</p>
      <div><a href="../products.html">제품</a><a href="../about.html">내 소개</a><a href="index.html">이야기</a><a href="mailto:bnt1195@naver.com" target="_blank" rel="noopener noreferrer">이메일</a><a href="https://www.instagram.com/bntheim_1195/" target="_blank" rel="noopener noreferrer">인스타그램</a></div>
    </div>
  </footer>

  <script>
  (function () {
    var list = document.getElementById('story-list');

    function element(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function formatDate(value) {
      var date = new Date(value + 'T00:00:00');
      if (isNaN(date)) return value || '';
      return date.getFullYear() + '. ' + (date.getMonth() + 1) + '. ' + date.getDate() + '.';
    }

    function postUrl(post) {
      return post.url ? String(post.url) : 'post.html?id=' + encodeURIComponent(post.id || '');
    }

    function render(posts) {
      if (!Array.isArray(posts) || posts.length === 0) {
        list.replaceChildren(element('li', 'story-status', '아직 올라온 이야기가 없습니다.'));
        return;
      }

      list.replaceChildren();
      posts.slice().sort(function (a, b) {
        return String(b.date || '').localeCompare(String(a.date || ''));
      }).forEach(function (post) {
        var item = element('li', 'story-list-card');
        var link = element('a');
        link.href = postUrl(post);

        var time = element('time', null, formatDate(post.date));
        time.setAttribute('datetime', String(post.date || ''));
        link.appendChild(time);
        link.appendChild(element('h2', null, String(post.title || '(제목 없음)')));
        if (post.summary) link.appendChild(element('p', 'story-summary', String(post.summary)));
        link.appendChild(element('span', 'story-card-arrow', '읽어보기 →'));
        item.appendChild(link);
        list.appendChild(item);
      });
    }

    fetch('posts.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error(response.status);
        return response.json();
      })
      .then(render)
      .catch(function () {
        list.replaceChildren(element('li', 'story-status', '이야기를 불러오지 못했습니다. 잠시 후 다시 확인해주세요.'));
      });
  })();
  </script>
</body>
</html>
