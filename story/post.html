<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="author" content="">
  <meta name="theme-color" content="#F6F1E7">
  <link rel="canonical" href="">
  <meta property="og:type" content="article">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <title>이야기 | DIYOUTLET</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body class="story-post-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>

  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="../index.html" aria-label="DIYOUTLET 홈">
        <span>DIY</span>OUTLET<i aria-hidden="true"></i>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
        <span class="sr-only">메뉴 열기</span>
        <span></span><span></span>
      </button>
      <nav class="main-menu" id="main-menu" aria-label="주 메뉴">
        <a href="../products.html">제품</a>
        <a href="../about.html">내 소개</a>
        <a href="index.html" aria-current="page">이야기</a>
        <a href="../index.html#contact">문의</a>
      </nav>
    </div>
  </header>

  <div class="story-post-wrap">
    <a class="story-back" href="index.html">← 이야기 목록</a>
    <main id="main"></main>
  </div>

  <footer class="site-footer">
    <div class="container footer-top">
      <a class="footer-logo" href="../index.html"><span>DIY</span>OUTLET</a>
      <p>생활에 필요한 다양한 상품을 한곳에서.</p>
    </div>
    <div class="container footer-bottom">
      <p>© <span id="year"></span> DIYOUTLET. ALL RIGHTS RESERVED.</p>
      <div><a href="../products.html">제품</a><a href="../about.html">내 소개</a><a href="index.html">이야기</a><a href="mailto:hello@diyoutlet.example">문의</a></div>
    </div>
  </footer>

  <script>
  (function () {
    var main = document.getElementById('main');

    function element(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function formatDate(value) {
      var date = new Date(value + 'T00:00:00');
      if (isNaN(date)) return value || '';
      return date.getFullYear() + '. ' + (date.getMonth() + 1) + '. ' + date.getDate() + '.';
    }

    // 빈 줄, ## 소제목, - 목록을 지원하는 안전한 본문 렌더러입니다.
    function renderBody(source) {
      var box = element('div', 'post-body');
      var blocks = String(source || '').replace(/\r\n/g, '\n').split(/\n\s*\n/);
      blocks.forEach(function (block) {
        block = block.trim();
        if (!block) return;
        var lines = block.split('\n');
        if (lines.every(function (line) { return /^- /.test(line.trim()); })) {
          var list = element('ul');
          lines.forEach(function (line) {
            list.appendChild(element('li', null, line.trim().slice(2)));
          });
          box.appendChild(list);
        } else if (/^## /.test(block)) {
          box.appendChild(element('h2', null, block.slice(3).trim()));
        } else {
          box.appendChild(element('p', null, block));
        }
      });
      return box;
    }

    function notFound() {
      var box = element('div', 'post-notfound');
      box.appendChild(element('h1', null, '글을 찾을 수 없습니다'));
      box.appendChild(element('p', null, '주소가 잘못되었거나 삭제된 글일 수 있습니다.'));
      var link = element('a', 'text-link', '이야기 목록으로 돌아가기');
      link.href = 'index.html';
      box.appendChild(link);
      main.replaceChildren(box);
    }

    function postUrl(post) {
      return post.url ? String(post.url) : 'post.html?id=' + encodeURIComponent(post.id || '');
    }

    function setAttribute(selector, attribute, value) {
      var node = document.querySelector(selector);
      if (node) node.setAttribute(attribute, value);
    }

    function addStructuredData(data) {
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);
    }

    function setMeta(post) {
      var title = String(post.title || '이야기');
      var description = String(post.description || post.summary || '').slice(0, 160);
      var url = location.origin + location.pathname + '?id=' + encodeURIComponent(post.id || '');
      var author = String(post.author || '').trim();
      document.title = title + ' | DIYOUTLET';
      setAttribute('meta[name="description"]', 'content', description);
      setAttribute('meta[name="author"]', 'content', author);
      setAttribute('link[rel="canonical"]', 'href', url);
      setAttribute('meta[property="og:title"]', 'content', title);
      setAttribute('meta[property="og:description"]', 'content', description);
      setAttribute('meta[property="og:url"]', 'content', url);

      var article = {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        headline: title,
        description: description,
        datePublished: String(post.date || ''),
        dateModified: String(post.updated || post.date || ''),
        mainEntityOfPage: url,
        keywords: Array.isArray(post.tags) ? post.tags.map(String).join(', ') : ''
      };
      if (author) article.author = { '@type': 'Person', name: author };
      addStructuredData(article);

      var faq = Array.isArray(post.faq) ? post.faq.filter(function (item) {
        return item && item.q && item.a;
      }) : [];
      if (faq.length) {
        addStructuredData({
          '@context': 'https://schema.org',
          '@type': 'FAQPage',
          mainEntity: faq.map(function (item) {
            return {
              '@type': 'Question',
              name: String(item.q),
              acceptedAnswer: { '@type': 'Answer', text: String(item.a) }
            };
          })
        });
      }
    }

    function renderFaq(faq) {
      var section = element('section', 'post-faq');
      section.appendChild(element('h2', null, '자주 묻는 질문'));
      faq.forEach(function (item) {
        var details = element('details');
        details.appendChild(element('summary', null, String(item.q)));
        details.appendChild(element('p', null, String(item.a)));
        section.appendChild(details);
      });
      return section;
    }

    function renderSources(sources) {
      var section = element('section', 'post-sources');
      section.appendChild(element('h2', null, '참고·출처'));
      var list = element('ol');
      sources.forEach(function (source) {
        var item = element('li');
        if (source && source.url) {
          var link = element('a', null, String(source.title || source.url));
          link.href = String(source.url);
          link.rel = 'noopener noreferrer';
          link.target = '_blank';
          item.appendChild(link);
        } else {
          item.textContent = String(source && source.title || source || '');
        }
        list.appendChild(item);
      });
      section.appendChild(list);
      return section;
    }

    function render(posts) {
      var id = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('slug');
      posts = (Array.isArray(posts) ? posts : []).slice().sort(function (a, b) {
        return String(b.date || '').localeCompare(String(a.date || ''));
      });
      var index = posts.findIndex(function (post) {
        return String(post.id) === id || (post.url && String(post.url).replace(/\.html$/, '') === id);
      });
      if (index < 0) {
        notFound();
        return;
      }

      var post = posts[index];
      setMeta(post);
      var article = element('article', 'story-article');
      var head = element('header', 'post-head');
      var time = element('time', null, formatDate(post.date));
      time.setAttribute('datetime', String(post.date || ''));
      head.appendChild(time);
      head.appendChild(element('h1', null, String(post.title || '(제목 없음)')));

      if (post.author || (post.updated && post.updated !== post.date)) {
        var meta = element('div', 'post-meta');
        if (post.author) meta.appendChild(element('span', null, String(post.author)));
        if (post.updated && post.updated !== post.date) meta.appendChild(element('span', null, '수정 ' + formatDate(post.updated)));
        head.appendChild(meta);
      }

      if (Array.isArray(post.tags) && post.tags.length) {
        var tags = element('div', 'post-tags');
        post.tags.forEach(function (tag) {
          tags.appendChild(element('span', 'post-tag', String(tag)));
        });
        head.appendChild(tags);
      }

      article.appendChild(head);
      article.appendChild(element('hr', 'post-rule'));
      article.appendChild(renderBody(post.body));

      var faq = Array.isArray(post.faq) ? post.faq.filter(function (item) {
        return item && item.q && item.a;
      }) : [];
      if (faq.length) article.appendChild(renderFaq(faq));
      if (Array.isArray(post.sources) && post.sources.length) article.appendChild(renderSources(post.sources));

      var previous = posts[index + 1];
      var next = posts[index - 1];
      if (previous || next) {
        var navigation = element('nav', 'post-navigation');
        navigation.setAttribute('aria-label', '다른 글');
        function addPostLink(item, className, label) {
          if (!item) {
            navigation.appendChild(element('span'));
            return;
          }
          var link = element('a', className);
          link.href = postUrl(item);
          link.appendChild(element('span', 'post-direction', label));
          link.appendChild(element('span', 'post-nav-title', String(item.title || '')));
          navigation.appendChild(link);
        }
        addPostLink(previous, 'previous', '이전 글');
        addPostLink(next, 'next', '다음 글');
        article.appendChild(navigation);
      }
      main.replaceChildren(article);
    }

    fetch('posts.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error(response.status);
        return response.json();
      })
      .then(render)
      .catch(notFound);
  })();
  </script>
</body>
</html>
